name: NeoTrade fuel pack
on:
  schedule:
    - cron: "17 * * * *"   # tiap jam di menit 17, lalu tunda acak 0-5 menit di script
  workflow_dispatch:
    inputs:
      force:
        description: "Klaim sekarang tanpa cek kredit"
        type: boolean
        default: false
      packs:
        description: "Jumlah pack kalau force"
        default: "1"
concurrency: { group: fuel, cancel-in-progress: false }
jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund --silent
      - run: node claim.mjs
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          STATUS_URL: ${{ secrets.STATUS_URL }}
          FORCE: ${{ inputs.force }}
          PACKS: ${{ inputs.packs }}
