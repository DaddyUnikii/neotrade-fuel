name: NeoTrade fuel pack
on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Jumlah fuel pack yang diklaim (1 pack = +1.500 kredit)"
        default: "1"
concurrency: { group: fuel, cancel-in-progress: false }
jobs:
  claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund --silent
      - run: node claim.mjs
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          STATUS_URL: ${{ secrets.STATUS_URL }}
          FORCE: "true"
          PACKS: ${{ inputs.packs }}
